server:
  port: 8080
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8085/eureka/
spring:
  cloud:
    gateway:
      routes:
      - id: currency
        uri: lb://currency
        predicates:
        - Path=/currency/**
        filters:
        - RewritePath=/currency(?<segment>/?.*), /api$\{segment}
        - TokenCheck
      - id: flights
        uri: lb://flights
        predicates:
        - Path=/flights/**
        filters:
        - RewritePath=/flights(?<segment>/?.*), /api/flights${segment}
        - TokenCheck
      - id: bonus
        uri: lb://bonus
        predicates:
        - Path=/bonus/**
        filters:
        - RewritePath=/bonus(?<segment>/?.*), /api/bonus${segment}
        - TokenCheck
      - id: login
        uri: lb://login
        predicates:
        - Path=/login/**
        filters:
        - RewritePath=/login(?<segment>/?.*), /api/login${segment}